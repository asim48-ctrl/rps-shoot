<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Rock Paper Scissors SHOOT!</title>
<style>
  :root {
    --card-rock: #d9a066;
    --card-paper: #8fc7ff;
    --card-scissors: #ff9ec2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo 2", system-ui, sans-serif;
    background: linear-gradient(160deg, #6ec3ff 0%, #a5e7ff 45%, #fff3b8 100%);
    overflow: hidden;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- header ---------- */
  header {
    width: 100%;
    max-width: 620px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px 0;
  }
  #mute {
    font-size: 26px;
    background: rgba(255,255,255,.75);
    border: 3px solid #fff;
    border-radius: 50%;
    width: 54px; height: 54px;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.12);
  }
  #mute:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }

  h1 {
    margin: 4px 0 6px;
    font-size: clamp(28px, 6vw, 44px);
    color: #fff;
    text-shadow: 0 4px 0 rgba(0,0,0,.18), 0 0 18px rgba(255,255,255,.6);
    letter-spacing: 2px;
    text-align: center;
  }

  /* ---------- scoreboard ---------- */
  .scoreboard {
    display: flex;
    gap: 16px;
    margin: 2px 0 8px;
  }
  .score {
    background: rgba(255,255,255,.85);
    border: 4px solid #fff;
    border-radius: 20px;
    padding: 4px 22px;
    font-size: clamp(26px, 5vw, 38px);
    font-weight: bold;
    box-shadow: 0 5px 0 rgba(0,0,0,.12);
    min-width: 130px;
    text-align: center;
  }
  .score .num { color: #ff7a00; }
  .score.robo .num { color: #5b7cfa; }

  /* ---------- stage ---------- */
  main { flex: 1; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 620px; }
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 200px;
  }
  .center { display: flex; flex-direction: column; align-items: center; }
  #fist {
    font-size: clamp(110px, 26vw, 180px);
    line-height: 1;
    filter: drop-shadow(0 10px 6px rgba(0,0,0,.25));
  }
  #fist.bounce { animation: fistbounce .7s ease-in-out infinite; }
  @keyframes fistbounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-34px) scale(1.06); }
  }
  #count {
    margin-top: 10px;
    font-size: clamp(26px, 7vw, 46px);
    font-weight: bold;
    color: #fff;
    text-shadow: 0 4px 0 rgba(0,0,0,.22), 0 0 14px rgba(255,255,255,.7);
    min-height: 1.3em;
    text-align: center;
    letter-spacing: 2px;
  }
  #count.shoot { color: #ffd93d; transform: scale(1.25); }
  /* the fist "fires": it turns into the actual rock / paper / scissors */
  #fist.shot { animation: shot .55s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes shot {
    0% { transform: translateY(0) scale(1); }
    35% { transform: translateY(-34px) scale(1.55) rotate(-10deg); }
    100% { transform: translateY(0) scale(1); }
  }
  .wiggle { animation: wiggle .4s ease-in-out 2; }
  @keyframes wiggle {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px) rotate(-3deg); }
    75% { transform: translateX(10px) rotate(3deg); }
  }

  /* ---------- result banner ---------- */
  #result {
    position: fixed;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(44px, 12vw, 90px);
    font-weight: bold;
    color: #fff;
    text-shadow: 0 6px 0 rgba(0,0,0,.25), 0 0 30px rgba(255,255,255,.9);
    z-index: 10;
    white-space: nowrap;
    text-align: center;
    pointer-events: none;
  }
  #result.show { animation: bannerpop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes bannerpop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-8deg); }
    70% { transform: translate(-50%, -50%) scale(1.15) rotate(2deg); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0); }
  }

  /* ---------- cards + hint ---------- */
  footer {
    width: 100%;
    max-width: 620px;
    padding: 10px 14px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .cards { display: flex; gap: 12px; width: 100%; justify-content: center; }
  .card {
    flex: 1;
    max-width: 170px;
    font-size: clamp(46px, 10vw, 64px);
    line-height: 1.15;
    padding: 10px 0 8px;
    border: 5px solid #fff;
    border-radius: 26px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.15);
    transition: transform .15s, box-shadow .15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .card .word { font-size: clamp(12px, 2.6vw, 16px); font-weight: bold; color: rgba(0,0,0,.5); letter-spacing: 1px; }
  .card.rock { background: var(--card-rock); }
  .card.paper { background: var(--card-paper); }
  .card.scissors { background: var(--card-scissors); }
  .card:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .card.selected {
    transform: scale(1.12);
    box-shadow: 0 0 0 6px #ffd93d, 0 6px 0 rgba(0,0,0,.15);
    animation: cardpulse 1s ease-in-out infinite;
  }
  @keyframes cardpulse {
    0%, 100% { transform: scale(1.12); }
    50% { transform: scale(1.18); }
  }
  .card:disabled { opacity: .55; pointer-events: none; }

  .hint {
    font-size: clamp(11px, 2.4vw, 14px);
    color: rgba(0,0,0,.4);
    text-align: center;
  }

  /* ---------- confetti ---------- */
  .confetti {
    position: fixed;
    top: -40px;
    font-size: 30px;
    animation: fall linear forwards;
    z-index: 20;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: .9; }
  }

  /* ---------- game over overlay ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 40, 90, .55);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
  }
  #overlay.show { display: flex; }
  #overlay .box {
    background: #fff;
    border-radius: 36px;
    padding: 26px 34px;
    text-align: center;
    box-shadow: 0 12px 0 rgba(0,0,0,.2);
    animation: boxpop .5s cubic-bezier(.2, 1.6, .4, 1) both;
    max-width: min(92vw, 540px);
    max-height: 88vh;
    overflow-y: auto;
  }
  @keyframes boxpop {
    0% { transform: scale(0) rotate(-6deg); }
    70% { transform: scale(1.05) rotate(1deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #overlay .big { font-size: clamp(56px, 14vw, 100px); }
  #overlay h2 { margin: 6px 0 2px; font-size: clamp(30px, 7vw, 48px); color: #333; }
  #overlay h3 { margin: 14px 0 4px; font-size: 19px; color: #555; }
  #overlay .braininfo { color: #888; font-size: 15px; margin-bottom: 4px; }
  .btnrow { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  #overlay .btn {
    font-size: 17px;
    font-weight: bold;
    color: #5b7cfa;
    background: #eef2ff;
    border: 4px solid #fff;
    border-radius: 30px;
    padding: 10px 22px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
    font-family: inherit;
  }
  #overlay .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  #overlay .btn.green { color: #fff; background: #3ed46a; }
  .rep-stats { font-size: 14px; color: #aaa; margin-bottom: 4px; }
  .rep-row { text-align: left; margin: 8px 0 2px; font-size: 15px; color: #444; }
  .rep-row .bar { display: inline-block; vertical-align: middle; width: 110px; height: 12px; background: #eee; border-radius: 8px; overflow: hidden; border: 2px solid #fff; margin-left: 6px; }
  .rep-row .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff7a00, #ffd93d); border-radius: 6px; transition: width .6s; }
  #overlay ul { text-align: left; margin: 6px 0 2px; padding-left: 22px; font-size: 14.5px; color: #444; }
  #overlay ul li { margin: 4px 0; }
  .kidbox { text-align: left; background: #fff8d9; border: 3px solid #ffe28a; border-radius: 16px; padding: 10px 14px; font-size: 14.5px; color: #7a5c00; margin-top: 10px; }
  /* parent insights */
  #p-overview { text-align: left; font-size: 13.5px; color: #444; margin: 8px 0 4px; }
  .p-construct { text-align: left; border: 3px solid #dde4ff; border-radius: 14px; padding: 8px 12px; margin: 8px 0; background: #f7f9ff; }
  .p-construct .p-name { font-weight: bold; color: #4a63d6; font-size: 14px; }
  .p-construct .p-evidence { color: #8a8a9a; font-size: 12px; margin: 2px 0; }
  .p-construct .p-interp { color: #333; font-size: 13px; }
  .p-construct.notable { border-color: #ffd93d; background: #fffbe8; }
  .p-construct.notable .p-name { color: #b07d00; }
  .p-note { text-align: left; background: #f0f0f5; border: 3px solid #d8d8e5; border-radius: 16px; padding: 8px 12px; font-size: 11.5px; color: #666; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <div></div>
  <h1>🪨 📄 ✂️ SHOOT!</h1>
  <button id="mute" title="sound on/off">🔊</button>
</header>

<section class="scoreboard">
  <div class="score">😀 <span class="num" id="score-you">0</span></div>
  <div class="score robo">🤖 <span class="num" id="score-robo">0</span></div>
</section>

<main>
  <div id="stage">
    <div class="center">
      <div id="fist">✊</div>
      <div id="count">Tap a move to play!</div>
    </div>
  </div>
</main>

<footer>
  <div class="cards">
    <button class="card rock"  data-move="rock"><span>🪨</span><span class="word">ROCK</span></button>
    <button class="card paper" data-move="paper"><span>📄</span><span class="word">PAPER</span></button>
    <button class="card scissors" data-move="scissors"><span>✂️</span><span class="word">SCISSORS</span></button>
  </div>
  <div class="hint">Tap a card to play — and throw your hand along with the robot! &nbsp;·&nbsp; keys: 1 2 3</div>
</footer>

<div id="result"></div>
<div id="overlay">
  <div class="box">
    <div id="screen-main">
      <div class="big" id="over-emoji">🎉</div>
      <h2 id="over-title">YOU WIN!</h2>
      <div class="braininfo" id="over-brain"></div>
      <div class="btnrow">
        <button class="btn" id="report-btn">HOW YOU PLAY 📊</button>
        <button class="btn" id="parent-btn">PARENT INSIGHTS 🧠</button>
        <button class="btn green" id="again">PLAY AGAIN 🔄</button>
      </div>
    </div>
    <div id="screen-report" hidden>
      <h3>🧠 HOW YOU PLAY</h3>
      <div class="rep-stats" id="rep-stats"></div>
      <div class="rep-row">The robot could guess your move: <b id="rep-pred">0%</b>
        <div class="bar"><div class="fill" id="rep-predfill"></div></div>
      </div>
      <div class="rep-row">Button mashing: <b id="rep-mash"></b></div>
      <ul id="rep-patterns"></ul>
      <h3>🎯 HOW TO BEAT THE ROBOT</h3>
      <ul id="rep-advice"></ul>
      <div class="kidbox">💬 <span id="rep-kid"></span></div>
      <div class="btnrow">
        <button class="btn" id="back-btn">← BACK</button>
        <button class="btn green" id="again2">PLAY AGAIN 🔄</button>
      </div>
    </div>
    <div id="screen-parent" hidden>
      <h3>🧠 PARENT INSIGHTS</h3>
      <div class="rep-stats" id="p-stats"></div>
      <div id="p-overview"></div>
      <div id="p-constructs"></div>
      <h3>🎯 TRY WITH YOUR CHILD</h3>
      <ul id="p-tips"></ul>
      <div class="p-note" id="p-note"></div>
      <div class="btnrow">
        <button class="btn" id="p-back">← BACK</button>
        <button class="btn green" id="again3">PLAY AGAIN 🔄</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

/* ================= game rules ================= */
const MOVES = ["rock", "paper", "scissors"];
const CARD_EMOJI = { rock: "🪨", paper: "📄", scissors: "✂️" };
const HAND_EMOJI = { rock: "✊", paper: "✋", scissors: "✌️" }; // the hand movements
const BEATEN_BY = { rock: "paper", paper: "scissors", scissors: "rock" }; // what beats X
const BEATS     = { rock: "scissors", paper: "rock", scissors: "paper" }; // what X beats

/* ================= sound (tiny synth, no files) ================= */
let audio = null, muted = false;
function beep(freq, dur, type = "sine", vol = 0.16, when = 0) {
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const t0 = audio.currentTime + when;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) { /* no audio is fine */ }
}
const sfx = {
  select: () => beep(660, 0.09, "triangle", 0.14),
  count(n)  { beep(330 + n * 110, 0.14, "square", 0.12); },        // rising boops
  shoot()   { beep(880, 0.28, "square", 0.16); beep(1760, 0.2, "sine", 0.08, 0.02); },
  win()     { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.22, "triangle", 0.16, i * 0.13)); },
  lose()    { [392, 330, 262].forEach((f, i) => beep(f, 0.28, "sine", 0.13, i * 0.18)); },
  tie()     { beep(440, 0.12, "triangle", 0.14); beep(440, 0.12, "triangle", 0.14, 0.16); },
  cheer()   { [660, 880, 990, 1320].forEach((f, i) => beep(f, 0.25, "triangle", 0.16, i * 0.12)); },
};

/* ================= truly random pick (crypto, uniform) =================
   2^32 - 1 is divisible by 3, so a single uint32 mod 3 is perfectly
   uniform with zero bias. No Math.random anywhere near decisions. */
function uniformRandom() {
  const buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  return MOVES[buf[0] % 3];
}

/* ================= the learning computer ================= */
let history = [];       // player's moves this session
let outcomes = [];      // 'win' | 'lose' | 'tie' for the player
let compMoves = [];     // what the computer played
// Each session gets a random "smartness" (0.2 = mostly random, 0.85 = reads you well)
let smartness = randomSmartness();

function randomSmartness() {
  const buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  return 0.2 + (buf[0] % 1000) / 1000 * 0.65; // 0.20 .. 0.85
}

function computePrediction(hist, outs, comps) {
  if (hist.length === 0) return null;
  const last = hist[hist.length - 1];
  const lastOutcome = outs[outs.length - 1];
  const compLast = comps[comps.length - 1];
  const score = { rock: 0, paper: 0, scissors: 0 };
  const noise = () => Math.random() * 1.2; // tiny jitter so it's never robotic

  // 1. overall tendency, recent moves weighted more
  hist.forEach((m, i) => { score[m] += 1 + (i / hist.length) * 1.5; });

  // 2. bigram: what does this player usually play right after <last>?
  for (let i = 1; i < hist.length; i++) {
    if (hist[i - 1] === last) score[hist[i]] += 3.5;
  }

  // 3. reacts to the last result:
  //    - won with X  -> likely to repeat X (win-stay)
  //    - lost to X   -> likely to copy X (play what just beat them)
  //    - tied with X -> might switch to the move that beats X
  if (lastOutcome === "win") {
    score[last] += 4;
  } else if (lastOutcome === "lose") {
    score[compLast] += 4;
  } else {
    score[BEATEN_BY[last]] += 2;
  }

  // 4. counter-reactive: if the player usually beats the robot's last throw,
  //    expect that habit to continue
  if (comps.length >= 4) {
    let c = 0;
    for (let i = 1; i < comps.length; i++) {
      if (hist[i] === BEATS[comps[i - 1]]) c++;
    }
    if (c / (comps.length - 1) >= 0.5) score[BEATS[compLast]] += 3.5;
  }

  MOVES.forEach(m => { score[m] += noise(); });
  return MOVES.reduce((best, m) => (score[m] > score[best] ? m : best), "rock");
}

function predictPlayerMove() { return computePrediction(history, outcomes, compMoves); }

function computerMove() {
  if (history.length === 0) return uniformRandom();
  // "thinks ahead": with probability = smartness, counter the predicted move;
  // otherwise play a truly random throw.
  if (Math.random() >= smartness) return uniformRandom();
  const predicted = predictPlayerMove();
  if (predicted === null) return uniformRandom();
  return BEATEN_BY[predicted];
}

/* ================= behavior report =================
   Reads the session's history and describes HOW the player thinks:
   random mashing vs. habits/fallacies, how readable they were, and
   what to practice — including a line to say to the child. */
/* shared habit detection: rates as {pct, total} | null */
function computeHabits(hist, outs, comps) {
  const n = hist.length;
  const rate = (cond, same, copy) => {
    let c = 0, total = 0;
    for (let i = 1; i < n; i++) {
      if (!cond(outs[i - 1])) continue;
      total++;
      const hit = copy ? hist[i] === comps[i - 1]
        : same ? hist[i] === hist[i - 1]
               : hist[i] !== hist[i - 1];
      if (hit) c++;
    }
    return total < 3 ? null : { pct: Math.round((c / total) * 100), total };
  };
  let beatLast = null;
  if (n >= 4) {
    let c = 0;
    for (let i = 1; i < n; i++) if (hist[i] === BEATS[comps[i - 1]]) c++;
    beatLast = { pct: Math.round((c / (n - 1)) * 100), total: n - 1 };
  }
  // repeating rhythm (period 2 or 3), e.g. rock → paper → scissors → rock…
  let cycle = null;
  for (const L of [2, 3]) {
    if (n - L < 1) continue;
    let matches = 0;
    for (let i = L; i < n; i++) if (hist[i] === hist[i - L]) matches++;
    const fit = matches / (n - L);
    const seq = hist.slice(-L);
    // a "rhythm" needs at least two different moves (all-rock is just a favorite)
    if (fit >= 0.7 && new Set(seq).size > 1) { cycle = { seq, fit }; break; }
  }
  return {
    winStay: rate(o => o === "win", true, false),
    loseSwitch: rate(o => o === "lose", false, false),
    loseStay: rate(o => o === "lose", true, false),
    tieSwitch: rate(o => o === "tie", false, false),
    copyAfterLose: rate(o => o === "lose", false, true),
    beatLast, cycle,
  };
}

function buildReport(hist, outs, comps) {
  const n = hist.length;
  const counts = { rock: 0, paper: 0, scissors: 0 };
  hist.forEach(m => counts[m]++);
  const pct = m => (n ? Math.round((counts[m] / n) * 100) : 0);

  let fav = "rock", favPct = 0;
  MOVES.forEach(m => { if (pct(m) >= favPct) { favPct = pct(m); fav = m; } });

  // how often the robot's own predictor would have guessed right, round by round
  let correct = 0;
  for (let i = 1; i < n; i++) {
    if (computePrediction(hist.slice(0, i), outs.slice(0, i), comps.slice(0, i)) === hist[i]) correct++;
  }
  const predictability = n > 1 ? Math.round((correct / (n - 1)) * 100) : 0;

  // how evenly the throws are spread (100 = perfectly uniform)
  const dev = MOVES.reduce((s, m) => s + Math.abs(counts[m] - n / 3), 0);
  const uniformity = n > 1 ? Math.max(0, Math.round(100 * (1 - dev / (2 * n / 3)))) : 0;
  // mashing = uniform AND hard to predict — but strong visible patterns
  // below override it (a plan is not button mashing)
  let mashing = Math.round((uniformity + (100 - predictability)) / 2);

  // conditional habits: {pct, total} | null. NOTE: switching after a
  // loss/tie is the RANDOM default (2/3), so those need ~85%+ to count;
  // everything else 60%+.
  const { winStay, loseSwitch, loseStay, tieSwitch, copyAfterLose, beatLast, cycle } = computeHabits(hist, outs, comps);
  const cycleEmojis = cycle ? cycle.seq.map(m => CARD_EMOJI[m]).join("") : "";

  const patterns = [];
  if (beatLast?.pct >= 60) patterns.push(`You beat the robot's last throw (${beatLast.pct}%) — classic counter-play`);
  if (favPct >= 55) patterns.push(`You have a favorite: ${CARD_EMOJI[fav]} ${fav} — ${favPct}% of all throws`);
  if (cycle) patterns.push(`You play a rhythm: ${cycleEmojis}${cycleEmojis}… (matches ${Math.round(cycle.fit * 100)}% of the time)`);
  if (winStay?.pct >= 60) patterns.push(`After a win you throw the same again (${winStay.pct}%)`);
  if (loseStay?.pct >= 60) patterns.push(`After a loss you keep the same move (${loseStay.pct}%) — good trap-breaking`);
  if (loseSwitch?.pct >= 85) patterns.push(`After a loss you switch moves (${loseSwitch.pct}%)`);
  if (tieSwitch?.pct >= 85) patterns.push(`After a tie you switch (${tieSwitch.pct}%) — ties don't mean change is due!`);
  if (copyAfterLose?.pct >= 60) patterns.push(`After a loss you copy what the robot threw (${copyAfterLose.pct}%)`);
  if (!patterns.length) patterns.push("No strong habits — every throw was a fresh surprise");

  // A visible plan is NOT button mashing. Aggregate how far the player's
  // behavior deviates from pure randomness, scaled by how many samples each
  // habit is based on — one loud blip isn't enough to override.
  const signal = (h, baseline) => !h ? 0
    : Math.max(0, (h.pct - baseline) / (100 - baseline)) * Math.min(1, h.total / 6);
  let totalSignal = 0;
  totalSignal += signal(beatLast, 33) * 1.2;
  totalSignal += signal(winStay, 33);
  totalSignal += signal(loseStay, 33);
  totalSignal += signal(loseSwitch, 67) * 1.2;
  totalSignal += signal(tieSwitch, 67) * 1.2;
  totalSignal += signal(copyAfterLose, 33);
  if (favPct >= 55) totalSignal += signal({ pct: favPct, total: n }, 33);
  if (cycle) totalSignal += 1.5;
  if (totalSignal >= 1.5) mashing = Math.min(mashing, 33);
  else if (totalSignal >= 1.0) mashing = Math.min(mashing, 45);

  const advice = [];
  if (predictability >= 50) advice.push(`The robot guessed your next move ${predictability}% of the time. Mix up your throws more!`);
  if (mashing >= 66) advice.push("Mostly random button mashing — try a plan: watch the robot's last throw and play what beats it.");
  if (beatLast?.pct >= 60) advice.push("You beat the robot's last throw — it's learning that! Sometimes copy the robot's last move to surprise it.");
  if (favPct >= 55) advice.push(`You lean on ${CARD_EMOJI[fav]} ${fav}. Spread your throws across all three.`);
  if (cycle) advice.push("Break your rhythm — start a round with a move that's not 'next in the pattern'.");
  if (winStay?.pct >= 60) advice.push("After a win, sometimes don't repeat. Surprise the robot!");
  if (loseStay?.pct >= 60) advice.push("Staying after a loss breaks the robot's trap — now try staying after a WIN sometimes too.");
  if (loseSwitch?.pct >= 85) advice.push("After a loss, sometimes keep the same move — the robot expects a switch.");
  if (tieSwitch?.pct >= 85) advice.push("After a tie, switch only when you mean to. Make it a choice, not a habit.");
  if (copyAfterLose?.pct >= 60) advice.push("Don't copy the robot's last throw — it is waiting for exactly that.");
  if (!advice.length) advice.push("You're unpredictable — keep it up, the robot can't read you.");
  advice.length = Math.min(advice.length, 3); // keep the report scannable

  const mashLabel = mashing >= 66 ? "HIGH — button mashing! 🌀"
    : mashing >= 34 ? "MEDIUM — some habits, some surprises"
    : "LOW — a clear plan the robot can see";

  let kid;
  if (mashing >= 66) kid = "You pressed buttons super fast! Next time think: what would beat the robot's last move?";
  else if (cycle) kid = `You made a pattern (${cycleEmojis}…) — the robot danced along! Break the pattern to trick it.`;
  else if (beatLast?.pct >= 60) kid = "You watch what the robot threw and beat it — clever! Now try a surprise: throw the same as the robot.";
  else if (favPct >= 55) kid = `You really like ${CARD_EMOJI[fav]}! The robot noticed. Try all three hands.`;
  else if (winStay?.pct >= 60) kid = "When you win, you stay — robots love that. Mix it up!";
  else if (loseStay?.pct >= 60) kid = "You don't change after losing — good, that tricks the robot!";
  else if (loseSwitch?.pct >= 85) kid = "When you lose, you change — that's smart! But the robot knows, so sometimes don't.";
  else if (tieSwitch?.pct >= 85) kid = "After a tie you change — but ties aren't losses. Keep your hand sometimes!";
  else if (copyAfterLose?.pct >= 60) kid = "You copy the robot when you lose — it expects that. Surprise it!";
  else if (predictability >= 50) kid = "The robot was reading your hands! Change what you throw more often.";
  else kid = "You're tricky! The robot had to think really hard about you.";

  return { n, predictability, mashing, mashLabel, patterns, advice, kid, habits: { winStay, loseSwitch, loseStay, tieSwitch, copyAfterLose, beatLast, cycle } };
}

function renderReport() {
  const rep = buildReport(history, outcomes, compMoves);
  $("rep-stats").textContent = `${rep.n} rounds · you ${you} — robot ${robo}`;
  $("rep-pred").textContent = rep.predictability + "%";
  $("rep-predfill").style.width = rep.predictability + "%";
  $("rep-mash").textContent = rep.mashLabel;
  $("rep-patterns").innerHTML = "";
  rep.patterns.forEach(p => { const li = document.createElement("li"); li.textContent = p; $("rep-patterns").appendChild(li); });
  $("rep-advice").innerHTML = "";
  rep.advice.forEach(a => { const li = document.createElement("li"); li.textContent = a; $("rep-advice").appendChild(li); });
  $("rep-kid").textContent = rep.kid;
}

/* ================= parent insights (adult-facing report) =================
   Professional behavioral observation, framed around established constructs
   from decision-making research: reinforcement sensitivity (win-stay /
   lose-shift), negative recency, opponent modeling, perseveration vs.
   flexibility, and strategy coherence. Deliberately NOT a diagnostic tool. */
function buildParentReport(hist, outs, comps) {
  const n = hist.length;
  const rep = buildReport(hist, outs, comps);
  const h = rep.habits;
  const counts = { rock: 0, paper: 0, scissors: 0 };
  hist.forEach(m => counts[m]++);
  const pct = m => Math.round((counts[m] / n) * 100);
  const wins = outs.filter(o => o === "win").length;
  const losses = outs.filter(o => o === "lose").length;
  const ties = outs.filter(o => o === "tie").length;

  // after two straight losses, how often does the child change move?
  let streakSwitch = null;
  let c = 0, t = 0;
  for (let i = 2; i < n; i++) {
    if (outs[i - 2] === "lose" && outs[i - 1] === "lose") { t++; if (hist[i] !== hist[i - 1]) c++; }
  }
  if (t >= 2) streakSwitch = Math.round((c / t) * 100);
  let repeats = 0;
  for (let i = 1; i < n; i++) if (hist[i] === hist[i - 1]) repeats++;
  const repeatRate = n > 1 ? Math.round((repeats / (n - 1)) * 100) : 0;
  const favPct = Math.max(...MOVES.map(m => pct(m)));

  const constructs = [];
  const P = (name, evidence, interp, flag) => constructs.push({ name, evidence, interp, flag });

  P("Reinforcement sensitivity — win-stay / lose-shift",
    `Repeats a winning move ${h.winStay ? h.winStay.pct + "%" : "n/a"} of the time; changes after a loss ${h.loseSwitch ? h.loseSwitch.pct + "%" : "n/a"} of the time.`,
    (h.winStay?.pct >= 70 || h.loseSwitch?.pct >= 90)
      ? "Outcome-driven responding: choices track wins and losses closely — the classic win-stay / lose-shift signature of reinforcement learning. The child is engaged with feedback rather than playing on autopilot."
      : "Outcome feedback influences choices only mildly; play appears driven more by internal scripts or exploration than by the scoreboard.",
    (h.winStay?.pct >= 70 || h.loseSwitch?.pct >= 90) ? "notable" : "typical");

  const recency = h.tieSwitch?.pct >= 85 || streakSwitch >= 80;
  P("Negative recency — the “change is due” bias",
    `Changes after a tie ${h.tieSwitch ? h.tieSwitch.pct + "%" : "n/a"} of the time; after two straight losses, switches ${streakSwitch ? streakSwitch + "%" : "n/a"} of the time.`,
    recency
      ? "Tendency to expect outcomes to balance out after neutral or bad results. Negative recency (the gambler's fallacy) is among the most common reasoning biases in adults; in a young child it shows probability intuition still heavily weighted toward the most recent events."
      : "No strong tendency to expect change after ties or losses — fewer “change is due” expectations than is common.",
    recency ? "notable" : "typical");

  const opp = h.beatLast?.pct ?? 33;
  P("Opponent modeling — reading the other player",
    `Beat the robot's previous throw ${h.beatLast ? h.beatLast.pct + "%" : "n/a"} of the time (chance ≈ 33%).`,
    opp >= 60
      ? "Anticipates and counters the opponent's last action — level-1 opponent modeling. For a child of ~4, whose perspective-taking is still emerging, this is an early and sophisticated strategic signal."
      : opp <= 40 && n >= 10
        ? "Little evidence of watching the opponent; play is mostly self-directed. Typical for this age — reading another player's actions develops with practice and guided play."
        : "Moderate sensitivity to the opponent's previous move — early signs of counter-play.",
    opp >= 60 ? "notable" : "typical");

  P("Perseveration vs. deliberate repetition",
    `Keeps the same move after a loss ${h.loseStay ? h.loseStay.pct + "%" : "n/a"} of the time; overall repeat rate ${repeatRate}%.`,
    h.loseStay?.pct >= 70
      ? "Holds the same move after losing. Two readings: deliberate trap-breaking (intentionally frustrating the opponent's prediction) or perseverative responding (difficulty shifting after negative feedback). Watch whether the child shows intent — smiling, narrating — when repeating; both readings are developmentally normal."
      : "Shifts readily after losses — good cognitive flexibility with minimal perseveration.",
    h.loseStay?.pct >= 70 ? "notable" : "typical");

  P("Strategy coherence — readability",
    `A predictive model of the child's choices was correct ${rep.predictability}% of the time (chance ≈ 33%).`,
    rep.predictability >= 50
      ? "Highly readable, consistent play — stable habits such as a favorite move or fixed responses after outcomes. Consistent rule use is a normal milestone at this age."
      : rep.predictability <= 35
        ? "Play is hard to model — exploratory or deliberately varied. Developmentally this usually reflects exploration rather than strategy, though it is genuinely strong play."
        : "Moderately readable — a mix of habits and variation.",
    rep.predictability >= 50 ? "notable" : "typical");

  P("Response style — systematic vs. exploratory",
    `Move usage: 🪨 ${pct("rock")}% · 📄 ${pct("paper")}% · ✂️ ${pct("scissors")}%. Estimated random/exploratory component: ${rep.mashing}%.`,
    rep.mashing >= 66
      ? "Largely random responding — consistent with exploration or attention drift. Both are typical for sustained play at this age; shorter sessions often sharpen focus."
      : rep.mashing <= 45
        ? "Systematic responding with identifiable habits — the child is likely playing by rules they can articulate when asked."
        : "Mixed responding — some habits, some exploration.",
    rep.mashing <= 45 || rep.mashing >= 66 ? "notable" : "typical");

  // overall picture
  const notable = constructs.filter(x => x.flag === "notable");
  const parts = [];
  if (h.beatLast?.pct >= 60) parts.push("emerging opponent awareness");
  if (rep.predictability >= 50) parts.push("consistent rule-based responding");
  if (rep.mashing >= 66) parts.push("largely exploratory responding");
  if (h.loseStay?.pct >= 70) parts.push("repetition after losses (deliberate or perseverative)");
  if (!parts.length) parts.push("a typical mix of habits and exploration");
  const overview = (notable.length
    ? `Most notable: ${notable.map(x => x.name.split(" — ")[0]).join("; ")}. `
    : "No single dominant pattern — varied, age-typical play. ") +
    `Overall, play shows ${parts.join(", ")}.`;

  const tips = [];
  if (rep.mashing >= 66) tips.push("Play “copy the robot” rounds: name the robot's move before it lands, then throw the same. Builds observation before reaction.");
  if (rep.predictability >= 50 || favPct >= 55) tips.push("Play “surprise rounds”: the rule is you may NOT throw the same move twice in a row.");
  if (recency) tips.push("Narrate your own thinking out loud: “I bet you'll throw rock again — you just won with it — so I'll throw paper.”");
  if (opp >= 60) tips.push("Raise the challenge: before the countdown, ask “the robot saw you beat paper — what will it do now?”");
  tips.push("Let your child call the countdown (“rock, paper, scissors, SHOOT!”) — leading the rhythm builds impulse timing.");
  if (tips.length > 4) tips.length = 4;

  return { n, wins, losses, ties, constructs, overview, tips };
}

function renderParentReport() {
  const pr = buildParentReport(history, outcomes, compMoves);
  const stars = Math.max(1, Math.round(smartness * 5));
  $("p-stats").textContent =
    `${pr.n} rounds · ${pr.wins}–${pr.losses}–${pr.ties} (W–L–T) · robot brain ${"⭐".repeat(stars)}${"☆".repeat(5 - stars)}`;
  $("p-overview").textContent = pr.overview;
  $("p-constructs").innerHTML = "";
  pr.constructs.forEach(x => {
    const div = document.createElement("div");
    div.className = "p-construct" + (x.flag === "notable" ? " notable" : "");
    div.innerHTML = `<div class="p-name">${x.name}</div><div class="p-evidence">${x.evidence}</div><div class="p-interp">${x.interp}</div>`;
    $("p-constructs").appendChild(div);
  });
  $("p-tips").innerHTML = "";
  pr.tips.forEach(tip => { const li = document.createElement("li"); li.textContent = tip; $("p-tips").appendChild(li); });
  $("p-note").textContent = "Scope: informal behavioral observation from a single game session — not a clinical or diagnostic assessment. Behavior in a 4-year-old varies a lot between days and settings; treat the patterns as conversation starters, and talk to a pediatric professional if you have genuine developmental concerns.";
}

/* ================= UI state ================= */
let state = "pick";                 // pick | countdown | reveal | gameover
let selection = null;
let you = 0, robo = 0;
const GOAL = 10;                    // first to 10 wins

const $ = (id) => document.getElementById(id);
const fist = $("fist"), count = $("count"), result = $("result");
const cards = [...document.querySelectorAll(".card")];

function setCountdownStep(text, isShoot) {
  count.textContent = text;
  count.classList.toggle("shoot", isShoot);
}

function startGame() {
  if (state !== "pick") return;
  state = "countdown";
  cards.forEach(c => c.disabled = true);
  fist.textContent = "✊"; // fresh fist for the next bounce
  fist.classList.remove("shot");

  const steps = ["🪨 ROCK", "📄 PAPER", "✂️ SCISSORS"];
  let i = 0;
  fist.classList.add("bounce");
  const step = () => {
    if (i < steps.length) {
      setCountdownStep(steps[i]);
      sfx.count(i);
      i++;
      setTimeout(step, 700);
    } else {
      setCountdownStep("SHOOT!", true);
      sfx.shoot();
      playRound();
    }
  };
  setTimeout(step, 700);
}

function playRound() {
  const player = selection;
  const comp = computerMove();
  compMoves.push(comp);
  history.push(player);

  const outcome = player === comp ? "tie"
    : BEATS[player] === comp ? "win" : "lose";
  outcomes.push(outcome);

  // the hand fires and HOLDS its throw: one big hand in the middle,
  // the child reads it against their own hand and works out who won
  fist.classList.remove("bounce");
  fist.textContent = HAND_EMOJI[comp];
  fist.classList.remove("shot");
  void fist.offsetWidth;
  fist.classList.add("shot");
  setCountdownStep("Who wins? 🤔");

  state = "reveal";
  // a quiet beat first — let the child figure out the result themselves…
  setTimeout(() => {
    if (outcome === "win") { you++; result.textContent = "YOU WIN! 🎉"; sfx.win(); confetti(); }
    else if (outcome === "lose") { robo++; result.textContent = "ROBOT WINS 🤖"; sfx.lose(); }
    else { result.textContent = "TIE! 🤝"; sfx.tie(); }
    $("score-you").textContent = you;
    $("score-robo").textContent = robo;
    result.classList.remove("show");
    void result.offsetWidth;
    result.classList.add("show");
  }, 2000);

  // …then a quick win / lose / draw, and back to picking
  setTimeout(() => {
    if (you >= GOAL || robo >= GOAL) return gameOver();
    state = "pick";
    setCountdownStep("Tap a move to play!");
    result.classList.remove("show");
    cards.forEach(c => c.disabled = false);
  }, 3800);
}

function gameOver() {
  state = "gameover";
  result.classList.remove("show");
  const won = you >= GOAL;
  $("over-emoji").textContent = won ? "🏆🎉" : "🤖";
  $("over-title").textContent = won ? "YOU WIN!" : "ROBOT WINS";
  const stars = Math.max(1, Math.round(smartness * 5));
  $("over-brain").textContent = `You ${you} — robot ${robo} · brain ${"⭐".repeat(stars)}${"☆".repeat(5 - stars)}`;
  $("screen-main").hidden = false;
  $("screen-report").hidden = true;
  $("screen-parent").hidden = true;
  $("overlay").classList.add("show");
  sfx.cheer();
  if (won) confetti(50);
}

function resetGame() {
  you = 0; robo = 0;
  history = []; outcomes = []; compMoves = [];
  smartness = randomSmartness(); // new session -> new difficulty
  $("score-you").textContent = "0";
  $("score-robo").textContent = "0";
  $("overlay").classList.remove("show");
  $("screen-main").hidden = false;
  $("screen-report").hidden = true;
  $("screen-parent").hidden = true;
  selection = null;
  fist.textContent = "✊";
  fist.classList.remove("shot");
  cards.forEach(c => { c.disabled = false; c.classList.remove("selected"); });
  setCountdownStep("Tap a move to play!");
  state = "pick";
}

/* ================= confetti ================= */
function confetti(n = 34) {
  const emojis = ["🪨", "📄", "✂️", "⭐", "🌈", "🎉", "✨", "💖"];
  for (let i = 0; i < n; i++) {
    const d = document.createElement("div");
    d.className = "confetti";
    d.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    d.style.left = Math.random() * 100 + "vw";
    d.style.animationDuration = 1.2 + Math.random() * 1.3 + "s";
    d.style.fontSize = 20 + Math.random() * 28 + "px";
    d.style.animationDelay = Math.random() * 0.4 + "s";
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 3200);
  }
}

/* ================= input ================= */
function pickMove(m) {
  if (state !== "pick") return;
  selection = m;
  sfx.select();
  cards.forEach(c => c.classList.toggle("selected", c.dataset.move === m));
  count.textContent = CARD_EMOJI[m] + " — here we go!";
  startGame(); // picking a move IS the start — no spacebar needed
}

cards.forEach(c => c.addEventListener("click", () => pickMove(c.dataset.move)));
$("again").addEventListener("click", resetGame);
$("again2").addEventListener("click", resetGame);
$("report-btn").addEventListener("click", () => {
  renderReport();
  $("screen-main").hidden = true;
  $("screen-report").hidden = false;
});
$("back-btn").addEventListener("click", () => {
  $("screen-main").hidden = false;
  $("screen-report").hidden = true;
});
$("parent-btn").addEventListener("click", () => {
  renderParentReport();
  $("screen-main").hidden = true;
  $("screen-parent").hidden = false;
});
$("p-back").addEventListener("click", () => {
  $("screen-main").hidden = false;
  $("screen-parent").hidden = true;
});
$("again3").addEventListener("click", resetGame);
$("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) resetGame(); });
$("mute").addEventListener("click", () => {
  muted = !muted;
  $("mute").textContent = muted ? "🔇" : "🔊";
});

window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "1" || k === "r") pickMove("rock");
  else if (k === "2" || k === "p") pickMove("paper");
  else if (k === "3" || k === "s") pickMove("scissors");
});

// test hooks (also used by the automated checks)
window.__rps = {
  MOVES, uniformRandom, predictPlayerMove, computerMove,
  BEATEN_BY, BEATS,
  get state() { return state; },
  debug: {
    setHistory(h, o, c) { history = h; outcomes = o; compMoves = c; },
    setSmartness(s) { smartness = s; },
    buildReport,
    buildParentReport,
    endGame() { you = GOAL; gameOver(); },
  },
};
</script>
